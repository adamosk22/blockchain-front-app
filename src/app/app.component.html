<h1>Solana sport bookmaker</h1>
<h2>Welcome to the online betting place. Please choose a match from the Premier League and make a bet!</h2>
<table mat-table [dataSource]="this.table" *ngIf="this.available">
    <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef> Date </th>
        <td mat-cell *matCellDef="let element"> {{element.utcDate}} </td>
    </ng-container>
    <ng-container matColumnDef="homeTeam">
        <th mat-header-cell *matHeaderCellDef> Home team </th>
        <td mat-cell *matCellDef="let element"> {{element.homeTeam}} </td>
    </ng-container>
    <ng-container matColumnDef="awayTeam">
        <th mat-header-cell *matHeaderCellDef> Away team </th>
        <td mat-cell *matCellDef="let element"> {{element.awayTeam}} </td>
    </ng-container>
    <ng-container matColumnDef="options">
        <th mat-header-cell *matHeaderCellDef> Options </th>
        <td mat-cell *matCellDef="let element">
          <mat-form-field appearance="fill">
            <mat-label>Choose an option</mat-label>
            <mat-select (selectionChange)="chooseOption($event.value,element)">
              <mat-option *ngFor="let bet of this.bets" [value]="bet">
                {{bet}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </td>
    </ng-container>
    <ng-container matColumnDef="actions">
        <th mat-header-cell  *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element">
             <button mat-stroked-button (click)="placeBet(element)">Bet</button>
        </td>
    </ng-container> 
    <tr mat-header-row *matHeaderRowDef="this.columnsToDisplay"></tr>
    <tr mat-row *matRowDef="let myRowData; columns: columnsToDisplay"></tr>
</table>

<router-outlet></router-outlet>
